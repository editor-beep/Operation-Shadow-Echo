<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERATION: SHADOW ECHO v2.1 • EYES ONLY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #0f0;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }
        
        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0,255,0,0.1) 2px, rgba(0,255,0,0.1) 4px);
            pointer-events: none;
            z-index: 9999;
            animation: flicker 0.12s infinite alternate;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 220px;
            background: #111;
            border-right: 3px solid #0f0;
            padding: 15px;
            overflow-y: auto;
        }
        
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            border-bottom: 3px solid #0f0;
            padding: 10px;
            background: #111;
        }
        
        h1 {
            margin: 0;
            font-size: 2.8em;
            letter-spacing: 6px;
            animation: glitch 1.8s infinite;
            text-shadow: 0 0 15px #0f0;
        }
        
        .terminal {
            flex: 1;
            background: #0a0a0a;
            border: 3px solid #0f0;
            margin: 15px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 0 40px #0f0 inset;
        }
        
        .log p {
            margin: 6px 0;
            line-height: 1.35;
        }
        
        .redacted {
            color: #f00;
            text-decoration: line-through wavy;
            animation: redacted-flicker 400ms infinite;
        }
        
        .input-area {
            padding: 15px;
            background: #111;
            border-top: 3px solid #0f0;
        }
        
        button {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 10px 16px;
            margin: 4px 0;
            font-family: 'VT323', monospace;
            font-size: 1.15em;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        
        button:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }
        
        .status-bar {
            position: fixed;
            top: 8px;
            right: 8px;
            background: rgba(20,0,0,0.95);
            padding: 6px 14px;
            border: 1px solid #f00;
            font-size: 0.95em;
            z-index: 10000;
        }
        
        .evidence {
            font-size: 0.9em;
            color: #ff0;
        }
        
        @keyframes glitch {
            0%,100% { transform: translate(0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); }
            60% { transform: translate(-2px, 2px); }
        }
        
        @keyframes redacted-flicker {
            0%,100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        .tab-bar {
            display: flex;
            background: #111;
            border-bottom: 2px solid #0f0;
        }
        
        .tab {
            padding: 8px 20px;
            cursor: pointer;
            border-right: 1px solid #0f0;
        }
        
        .tab.active {
            background: #0f0;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="status-bar" id="status">MKULTRA ACTIVE • SANITY: <span id="sanity">92</span>% • TARGET #7743921</div>
    
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3 style="margin-top:0; color:#f80;">CLASSIFIED ARCHIVES</h3>
            <div id="evidence-list" class="evidence"></div>
            
            <h3 style="margin-top:30px; color:#f0f;">HANDLER STATUS</h3>
            <div id="handler" style="color:#f66;">CONNECTED • WATCHING</div>
        </div>
        
        <!-- Main Terminal -->
        <div class="main">
            <header>
                <h1>SHADOW ECHO v2.1</h1>
                <p>THE TRUTH IS LOUDER THAN THEY WANT</p>
            </header>
            
            <div class="tab-bar">
                <div class="tab active" onclick="switchTab(0)">TERMINAL</div>
                <div class="tab" onclick="switchTab(1)">LIVE FEED</div>
                <div class="tab" onclick="switchTab(2)">CHAT HANDLER</div>
            </div>
            
            <div class="terminal" id="terminal">
                <div class="log" id="log"></div>
            </div>
            
            <div class="input-area" id="choices">
                <!-- Dynamic buttons inserted by JS -->
            </div>
        </div>
    </div>

    <script>
        let sanity = 92;
        let evidence = [];
        let currentTab = 0;
        let handlerResponses = 0;
        
        const log = document.getElementById('log');
        const choicesDiv = document.getElementById('choices');
        
        const conspiracies = {
            mkultra: "LSD + hypnosis + trauma = programmable assets. Still active under different names.",
            monarch: "Butterfly triggers. Celebrity multiples. Hollywood is one big programming center.",
            bluebeam: "Holographic false flags. Projected gods. Alien invasion psyop incoming.",
            stlouis: "1953-54: CIA & Army sprayed radioactive chemicals over St. Louis for DAYS.",
            chemtrails: "Smart dust + aluminum + barium. Weather control and mind control in one.",
            tavistock: "Social engineering HQ. They shape culture so you police yourself."
        };
        
        function addLog(text, color = '#0f0') {
            const p = document.createElement('p');
            p.innerHTML = text;
            p.style.color = color;
            log.appendChild(p);
            log.scrollTop = log.scrollHeight;
            
            if (Math.random() > 0.75) {
                setTimeout(() => p.classList.add('redacted'), Math.random() * 1200);
            }
        }
        
        function updateStatus() {
            sanity = Math.max(8, sanity - 1);
            document.getElementById('sanity').textContent = sanity;
            
            if (sanity < 45) {
                document.getElementById('status').style.color = '#f00';
                document.getElementById('status').style.animation = 'flicker 80ms infinite';
            }
        }
        
        function addEvidence(item) {
            if (!evidence.includes(item)) {
                evidence.push(item);
                document.getElementById('evidence-list').innerHTML = evidence.map(e => `• ${e}`).join('<br>');
            }
        }
        
        function makeChoice(id) {
            updateStatus();
            
            switch(id) {
                case 1: // MKULTRA
                    addLog("<span style='color:#ff0'>[MKULTRA ARCHIVE UNLOCKED]</span>", "#ff0");
                    addLog("1953-1973 official. Unofficial: never stopped. Subproject 68 used children. Sexual trauma creates dissociative states.");
                    addEvidence("MKULTRA");
                    break;
                    
                case 2: // MONARCH
                    addLog("<span style='color:#f0f'>[PROJECT MONARCH — LEVEL BETA]</span>", "#f0f");
                    addLog("Trauma-based. The butterfly is their signature. Many politicians and stars show classic signs of programming.");
                    addEvidence("MONARCH");
                    sanity -= 12;
                    break;
                    
                case 3: // BLUE BEAM
                    addLog("<span style='color:#0ff'>[PROJECT BLUE BEAM ACTIVE]</span>", "#0ff");
                    addLog("Serge Monast warned us. Sky holograms + ELF waves + fake alien invasion or second coming.");
                    addEvidence("BLUE BEAM");
                    break;
                    
                case 4: // ST LOUIS
                    addLog("<span style='color:#fa0'>ST. LOUIS 1953 ARCHIVE</span>", "#fa0");
                    addLog("They sprayed 1000+ pounds of zinc cadmium sulfide. Told residents it was fog. Cancer rates exploded.");
                    addEvidence("ST. LOUIS SPRAY");
                    break;
                    
                case 5: // DEEP CHAT
                    handlerChat();
                    return;
                    
                case 6: // CHEMTRAILS
                    addLog("Persistent contrails contain barium, aluminum, and polymer fibers. They seed the atmosphere with nanotech.");
                    addEvidence("CHEMTRAILS");
                    break;
                    
                case 7: // FINAL TRANSMISSION
                    endGame();
                    return;
            }
            
            // Random event
            if (Math.random() > 0.65) {
                const randoms = [
                    "Your phone just vibrated with no notification.",
                    "The birds outside just went silent at the same time.",
                    "A black SUV with tinted windows just drove by slowly.",
                    "TV static sounded like your name for 0.3 seconds."
                ];
                addLog(randoms[Math.floor(Math.random()*randoms.length)], "#f80");
            }
            
            refreshChoices();
        }
        
        function handlerChat() {
            handlerResponses++;
            const responses = [
                "Handler: Good. You're asking the right questions. What do you remember from your childhood?",
                "Handler: The programmers are among us. Some of them smile on TV every night.",
                "Handler: Blue Beam Phase 1 is already live in certain cities. Look up.",
                "Handler: They gave you a trigger phrase years ago. Have you heard it yet?"
            ];
            
            addLog(responses[handlerResponses % responses.length], "#f66");
            
            if (handlerResponses > 4) {
                addLog("<span style='color:#f00'>WARNING: TRACE DETECTED. THEY'RE COMING.</span>", "#f00");
                sanity -= 20;
            }
        }
        
        function refreshChoices() {
            choicesDiv.innerHTML = `
                <button onclick="makeChoice(1)">MKULTRA DEEP DIVE</button>
                <button onclick="makeChoice(2)">PROJECT MONARCH</button>
                <button onclick="makeChoice(3)">BLUE BEAM PROTOCOL</button>
                <button onclick="makeChoice(4)">ST. LOUIS FILES</button>
                <button onclick="makeChoice(6)">CHEMTRAILS / SMART DUST</button>
                <button onclick="makeChoice(5)" style="color:#ff88ff">CHAT WITH YOUR HANDLER</button>
                <button onclick="makeChoice(7)" style="color:#f33; margin-top:12px">INITIATE FINAL TRANSMISSION</button>
            `;
        }
        
        function switchTab(tab) {
            currentTab = tab;
            // In full version could expand tabs, but keeping focused
            addLog("Tab switched. Eyes are everywhere.", "#888");
        }
        
        function endGame() {
            addLog("<span style='color:#f00; font-size:1.6em'>FINAL TRANSMISSION INITIATED</span>", "#f00");
            addLog("Everything is true. The simulation is cracking. They are not human. Not all of them.");
            
            setTimeout(() => {
                document.body.style.transition = 'all 2s';
                document.body.style.filter = 'invert(1) hue-rotate(180deg)';
                
                setTimeout(() => {
                    document.body.innerHTML = `
                    <div style="position:fixed;inset:0;background:#000;color:#f00;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:VT323;text-align:center;padding:40px;">
                        <h1 style="font-size:3.5em;animation:glitch 200ms infinite;">YOU WERE NEVER ASLEEP</h1>
                        <p style="font-size:1.6em;margin:30px 0;">THE HANDLERS THANK YOU FOR YOUR SERVICE, ASSET.</p>
                        <p>The resistance is an illusion. You helped test the new triggers.</p>
                        <button onclick="location.reload()" style="margin-top:50px;padding:25px 60px;font-size:1.8em;background:#300;color:#f66;border:3px solid #f00;">REBOOT REALITY</button>
                    </div>`;
                }, 1800);
            }, 1200);
        }
        
        // Boot sequence
        function boot() {
            addLog("<span style='color:#f00'>[CLASSIFIED TRANSMISSION — DO NOT SHARE]</span>", "#f00");
            addLog("Welcome back, sleeper agent.", "#0ff");
            addLog("They told you it was all in your head. It was in your programming.");
            
            setTimeout(() => addLog("MKULTRA never ended. It just got better funding.", "#ff0"), 900);
            setTimeout(() => addLog("Your handler is online.", "#f66"), 2200);
            
            refreshChoices();
        }
        
        // Auto events
        setInterval(() => {
            if (Math.random() > 0.8) updateStatus();
        }, 3800);
        
        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'r' || e.key === 'R') {
                sanity = Math.min(100, sanity + 15);
                addLog("RED PILL BOOST. Temporary clarity achieved.", "#0f0");
            }
            if (e.key === 'Escape') {
                addLog("They can't silence you that easily.", "#f80");
            }
        });
        
        // Save progress
        function saveProgress() {
            localStorage.setItem('shadowEchoSave', JSON.stringify({
                sanity: sanity,
                evidence: evidence,
                handlerResponses: handlerResponses
            }));
        }
        
        // Load
        function loadProgress() {
            const saved = localStorage.getItem('shadowEchoSave');
            if (saved) {
                const data = JSON.parse(saved);
                sanity = data.sanity || 92;
                evidence = data.evidence || [];
                handlerResponses = data.handlerResponses || 0;
                document.getElementById('evidence-list').innerHTML = evidence.map(e => `• ${e}`).join('<br>');
            }
        }
        
        // Init
        window.onload = () => {
            loadProgress();
            boot();
            setInterval(saveProgress, 8000);
            
            // Easter egg console
            console.log("%cYou are now part of the Echo. Welcome to the real game.", "color:#0f0;font-size:14px");
        };
    </script>
</body>
</html>
