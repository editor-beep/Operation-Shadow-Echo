<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPERATION: SHADOW ECHO v3.0 • BLACK PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #020202;
            color: #00aa00;
            font-family: 'VT323', monospace;
            overflow: hidden;
            height: 100vh;
        }
        
        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0,60,0,0.3) 2px, rgba(0,60,0,0.3) 4px);
            pointer-events: none;
            z-index: 9999;
            animation: flicker 0.07s infinite alternate;
        }
        
        .container { 
            display: flex; 
            height: 100vh; 
            flex-direction: column; 
        }
        
        .sidebar {
            background: #050505;
            border-bottom: 3px solid #880000;
            padding: 10px 15px;
            flex-shrink: 0;
        }
        
        .main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            min-height: 0; 
        }
        
        header {
            text-align: center;
            border-bottom: 3px solid #880000;
            padding: 8px;
            background: #050505;
        }
        
        h1 {
            margin: 0;
            font-size: 2.3em;
            letter-spacing: 5px;
            animation: glitch 1.4s infinite;
            color: #cc0000;
            text-shadow: 0 0 25px #880000;
        }
        
        .terminal {
            flex: 1;
            background: #000;
            border: 3px solid #660000;
            margin: 8px;
            padding: 25px;
            overflow-y: auto;
            box-shadow: 0 0 35px #220000 inset;
            font-size: 1.85rem;           /* Much larger text */
            line-height: 1.5;
            min-height: 0;
        }
        
        .log p {
            margin: 12px 0;
        }
        
        .redacted {
            color: #ff2222;
            text-decoration: line-through wavy;
            animation: redacted-flicker 280ms infinite;
        }
        
        .input-area {
            padding: 12px 15px;
            background: #050505;
            border-top: 3px solid #880000;
            flex-shrink: 0;
        }
        
        button {
            background: #0a0a0a;
            color: #00bb00;
            border: 2px solid #660000;
            padding: 18px 20px;
            margin: 6px 0;
            font-size: 1.3rem;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }
        
        button:hover {
            background: #330000;
            color: #ff4444;
            border-color: #aa0000;
        }
        
        .status-bar {
            position: fixed;
            top: 8px;
            right: 8px;
            background: rgba(40,0,0,0.97);
            padding: 6px 14px;
            border: 1px solid #aa0000;
            z-index: 10000;
            color: #ff7777;
            font-size: 0.95rem;
        }
        
        @keyframes glitch {
            0%,100% { transform: translate(0); }
            20% { transform: translate(-4px, 3px); }
            40% { transform: translate(4px, -3px); }
        }
        
        @keyframes redacted-flicker { 
            0%,100% { opacity: 0.65; } 
            50% { opacity: 1; } 
        }
        
        @media (max-width: 768px) {
            .terminal { 
                font-size: 1.65rem; 
                padding: 18px;
            }
            button { font-size: 1.25rem; padding: 18px 14px; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="status-bar" id="status">MKULTRA ACTIVE • SANITY: <span id="sanity">83</span>% • TARGET #7743921</div>
    
    <div class="container">
        <div class="sidebar">
            <strong style="color:#ff6600;">COLLECTED EVIDENCE</strong><br>
            <div id="evidence-list" style="margin:8px 0; color:#cc8800; line-height:1.45;"></div>
            
            <strong style="color:#ff00aa; display:block; margin-top:15px;">HANDLER STATUS</strong>
            <span id="handler" style="color:#ff4477;">CONNECTED • MONITORING</span>
        </div>
        
        <div class="main">
            <header>
                <h1>SHADOW ECHO v3.0</h1>
                <p style="color:#990000;">ALL OF IT IS REAL. SIMULTANEOUSLY.</p>
            </header>
            
            <div class="terminal" id="terminal">
                <div class="log" id="log"></div>
            </div>
            
            <div class="input-area" id="choices"></div>
        </div>
    </div>

    <script>
        let sanity = 83;
        let evidence = [];
        let handlerResponses = 0;
        let messages = {};
        
        const log = document.getElementById('log');
        const choicesDiv = document.getElementById('choices');
        
        async function loadMessages() {
            try {
                const res = await fetch('messages.json');
                messages = await res.json();
                boot();
            } catch(e) {
                console.error("Could not load messages.json", e);
                boot(); // fallback
            }
        }
        
        function addLog(text, color = '#00aa00') {
            const p = document.createElement('p');
            p.innerHTML = text;
            p.style.color = color;
            log.appendChild(p);
            log.scrollTop = log.scrollHeight;
            
            if (Math.random() > 0.6) {
                setTimeout(() => p.classList.add('redacted'), 600 + Math.random() * 1400);
            }
        }
        
        function updateStatus() {
            sanity = Math.max(3, sanity - 1);
            document.getElementById('sanity').textContent = sanity;
            if (sanity < 35) document.getElementById('status').style.color = '#ff0000';
        }
        
        function addEvidence(item) {
            if (!evidence.includes(item)) {
                evidence.push(item);
                document.getElementById('evidence-list').innerHTML = evidence.map(e => `• ${e}`).join('<br>');
            }
        }
        
        function makeChoice(id) {
            updateStatus();
            const choice = messages.choices[id];
            
            if (!choice) return;
            
            if (choice.logs) {
                choice.logs.forEach(logText => addLog(logText));
                if (id === "1") addEvidence("MKULTRA");
                if (id === "2") addEvidence("MONARCH");
                if (id === "3") addEvidence("BLUE BEAM");
                if (id === "4") addEvidence("ST. LOUIS");
                if (id === "6") addEvidence("CHEMTRAILS");
            }
            
            if (id === "5") {
                handlerChat();
            } else if (id === "7") {
                endGame();
            } else {
                if (Math.random() > 0.5) {
                    const paranoia = messages.randomParanoia[Math.floor(Math.random() * messages.randomParanoia.length)];
                    addLog(paranoia, "#ff6666");
                }
                refreshChoices();
            }
        }
        
        function handlerChat() {
            handlerResponses++;
            const responses = messages.choices["5"].handlerResponses;
            addLog(responses[handlerResponses % responses.length], "#ff4488");
            
            if (handlerResponses >= 6) {
                addLog("<span style='color:#ff0000;font-size:1.3em'>TRACE COMPLETE. THEY KNOW.</span>", "#ff0000");
                sanity = Math.max(3, sanity - 35);
            }
            refreshChoices();
        }
        
        function refreshChoices() {
            let html = '';
            Object.keys(messages.choices).forEach(key => {
                const c = messages.choices[key];
                html += `<button onclick="makeChoice('${key}')">${c.label}</button>`;
            });
            choicesDiv.innerHTML = html;
        }
        
        function endGame() {
            addLog("<span style='color:#ff0000;font-size:1.8em'>FINAL TRANSMISSION INITIATED</span>", "#ff0000");
            setTimeout(() => {
                document.body.innerHTML = `
                <div style="position:fixed;inset:0;background:#000;color:#ff2222;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;font-family:VT323">
                    <h1 style="font-size:3em;animation:glitch 150ms infinite;">YOU WERE THE EXPERIMENT</h1>
                    <p style="font-size:1.8em;margin:40px 0;">THANK YOU FOR YOUR COMPLIANCE, ASSET.</p>
                    <button onclick="location.reload()" style="padding:25px 70px;font-size:1.8em;background:#220000;color:#ff6666;border:4px solid #990000;">REBOOT CONSCIOUSNESS</button>
                </div>`;
            }, 1400);
        }
        
        function boot() {
            if (messages.boot) {
                messages.boot.forEach(text => addLog(text));
            }
            refreshChoices();
        }
        
        setInterval(updateStatus, 3200);
        
        document.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'r') {
                sanity = Math.min(100, sanity + 22);
                addLog("RED PILL INJECTED • CLARITY RESTORED", "#00ff00");
            }
        });
        
        window.onload = loadMessages;
    </script>
</body>
</html>
