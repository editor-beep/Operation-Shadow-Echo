<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPERATION: SHADOW ECHO v6.0 // DECLASSIFIED</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --green: #00bb00;
            --dim: #007700;
            --blood: #660000;
            --blood-hot: #ff0000;
            --bg: #020202;
        }

        html, body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--green);
            font-family: 'VT323', monospace;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ---------- CRT OVERLAYS ---------- */
        .scanlines {
            position: fixed; inset: 0;
            background: repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0,60,0,0.28) 2px, rgba(0,60,0,0.28) 4px);
            pointer-events: none; z-index: 9000;
            animation: flicker 0.08s infinite alternate;
        }
        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 8999;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.85) 100%);
        }
        @keyframes flicker { from { opacity: 0.85; } to { opacity: 1; } }

        /* ---------- HEADER ---------- */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 200;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; padding: 6px 12px;
            background: linear-gradient(#070707, #030303);
            border-bottom: 3px solid #880000;
            flex-wrap: wrap;
        }
        .title {
            font-size: 1.7rem; color: #cc0000; margin: 0;
            text-shadow: 0 0 18px #880000;
            animation: glitch 2.2s infinite;
            letter-spacing: 1px;
        }
        .title small { color: var(--dim); font-size: 0.85rem; letter-spacing: 0; }
        @keyframes glitch {
            0%,92%,100% { transform: translate(0); text-shadow: 0 0 18px #880000; }
            93% { transform: translate(-3px,2px); text-shadow: -2px 0 #00ddff, 2px 0 #ff0000; }
            96% { transform: translate(3px,-1px); text-shadow: 2px 0 #00ddff, -2px 0 #ff0000; }
        }

        .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        /* ---------- SANITY METER ---------- */
        .sanity-box { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 160px; }
        .sanity-label { font-size: 0.9rem; color: #ff7777; letter-spacing: 1px; }
        .sanity-track {
            width: 160px; height: 14px; background: #100000;
            border: 1px solid #aa0000; position: relative; overflow: hidden;
        }
        .sanity-fill {
            height: 100%; background: linear-gradient(90deg, #003300, #00cc00);
            transition: width 0.4s ease, background 0.4s ease; width: 83%;
        }
        .sanity-fill.warn { background: linear-gradient(90deg, #443300, #ccaa00); }
        .sanity-fill.crit { background: linear-gradient(90deg, #440000, #ff0000); animation: pulse 0.4s infinite alternate; }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

        /* ---------- BUTTONS ---------- */
        .btn {
            background: #0a0a0a; color: var(--green);
            border: 2px solid var(--blood); padding: 7px 12px;
            font-family: 'VT323', monospace; font-size: 1.05rem;
            cursor: pointer; letter-spacing: 1px; white-space: nowrap;
            transition: background 0.12s, color 0.12s, border-color 0.12s;
        }
        .btn:hover { background: #2a0000; color: #ff5555; border-color: var(--blood-hot); }
        .btn.active { background: #330000; color: #ff5555; border-color: var(--blood-hot); }
        .btn.red { color: #ff5555; border-color: #aa0000; }

        /* ---------- LAYER TOGGLE ---------- */
        .layers { display: flex; gap: 4px; align-items: center; }
        .layers .lbl { font-size: 0.85rem; color: var(--dim); margin-right: 4px; }

        /* ---------- CANVAS ---------- */
        #viewport {
            position: fixed; inset: 0; top: 0; cursor: grab; z-index: 1;
            background:
                radial-gradient(circle at 20% 30%, rgba(0,40,0,0.15), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(40,0,0,0.18), transparent 45%),
                var(--bg);
        }
        #viewport.panning { cursor: grabbing; }
        #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }

        /* dotted grid */
        #grid {
            position: absolute; left: -5000px; top: -5000px; width: 10000px; height: 10000px;
            background-image: radial-gradient(rgba(0,90,0,0.25) 1px, transparent 1px);
            background-size: 42px 42px; pointer-events: none;
        }

        #edges {
            position: absolute; left: -5000px; top: -5000px; width: 10000px; height: 10000px;
            overflow: visible; pointer-events: none;
        }
        .edge-path { fill: none; stroke: var(--blood); stroke-width: 2; stroke-dasharray: 7 6; opacity: 0.75; }
        .edge-path.hot { stroke: var(--blood-hot); animation: dash 0.5s linear infinite; }
        @keyframes dash { to { stroke-dashoffset: -26; } }
        .edge-label {
            fill: #aa3333; font-family: 'VT323', monospace; font-size: 16px;
            text-anchor: middle; opacity: 0.7;
        }

        /* ---------- NODES ---------- */
        .node {
            position: absolute; width: 210px; background: #000;
            border: 3px solid var(--blood); color: var(--green);
            box-shadow: 0 0 18px rgba(40,0,0,0.9), inset 0 0 12px rgba(0,40,0,0.4);
            cursor: grab; padding: 0; overflow: hidden;
            transition: border-color 0.12s, box-shadow 0.12s, opacity 0.3s;
        }
        .node.dragging { cursor: grabbing; z-index: 50 !important; }
        .node:hover { border-color: var(--blood-hot); box-shadow: 0 0 30px #880000; animation: nodeglitch 0.32s infinite; }
        @keyframes nodeglitch {
            0%,100% { transform: translate(0); }
            25% { transform: translate(-1.5px,1px); }
            75% { transform: translate(1.5px,-1px); }
        }
        .node-head {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 8px; border-bottom: 2px solid var(--blood);
            font-size: 0.78rem; letter-spacing: 1px; background: rgba(20,0,0,0.6);
        }
        .node-tag { color: #ff6666; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .node-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px currentColor; flex-shrink: 0; }
        .node-body { padding: 9px 10px 11px; }
        .node-title { font-size: 1.25rem; line-height: 1.05; color: #00dd00; text-shadow: 0 0 8px rgba(0,120,0,0.6); }
        .node-sub { font-size: 0.82rem; color: var(--dim); margin-top: 5px; }
        .node-drain {
            margin-top: 8px; height: 5px; background: #001000; border: 1px solid #003300; position: relative;
        }
        .node-drain span { position: absolute; inset: 0; background: #cc0000; box-shadow: 0 0 6px #ff0000; }

        .node[data-type="handler"] { border-color: #00aa66; }
        .node[data-type="handler"] .node-dot { background: #00ffaa; }
        .node[data-type="handler"] .node-tag { color: #00ffaa; }
        .node[data-type="recover"] { border-color: #0066aa; }
        .node[data-type="recover"] .node-dot { background: #00ddff; }
        .node[data-type="recover"] .node-tag { color: #00ddff; }
        .node[data-type="terminal"] { border-color: #aa0000; }

        .node[data-layer="mythic"] .node-title { color: #cc66ff; text-shadow: 0 0 10px rgba(140,0,200,0.7); }
        .node[data-layer="deepstate"] .node-title { color: #ff9933; }

        /* ---------- MODAL ---------- */
        .modal-bg {
            position: fixed; inset: 0; z-index: 9500; display: none;
            align-items: center; justify-content: center; padding: 20px;
            background: rgba(0,0,0,0.86); backdrop-filter: blur(2px);
        }
        .modal-bg.show { display: flex; }
        .modal {
            width: min(640px, 100%); max-height: 82vh; overflow-y: auto;
            background: #050505; border: 3px solid #880000;
            box-shadow: 0 0 50px #330000, inset 0 0 30px rgba(0,30,0,0.5);
            padding: 22px 26px;
        }
        .modal h2 { color: #ff3333; margin: 0 0 14px; font-size: 1.7rem; text-shadow: 0 0 14px #880000; }
        .modal .doc-line { font-size: 1.25rem; line-height: 1.35; margin: 3px 0; color: #00cc00; }
        .modal .doc-line.redact { color: #550000; }
        .modal .doc-line.warn { color: #ffaa00; }

        /* ---------- FOIA TRAIL (declassified sources) ---------- */
        .doc-foia { margin-top: 18px; border-top: 1px dashed #550000; padding-top: 12px; }
        .foia-head {
            color: #ff7777; font-size: 1.05rem; letter-spacing: 1px; margin-bottom: 10px;
            text-shadow: 0 0 8px #660000;
        }
        .foia-item { display: flex; gap: 8px; align-items: flex-start; margin: 7px 0; font-size: 1.08rem; line-height: 1.3; }
        .foia-badge {
            flex-shrink: 0; font-size: 0.7rem; padding: 1px 6px; border: 1px solid;
            letter-spacing: 1px; margin-top: 3px; white-space: nowrap;
        }
        .foia-badge.open    { color: #00dd00; border-color: #007700; }
        .foia-badge.denied  { color: #ff4444; border-color: #770000; background: #1a0000; }
        .foia-badge.partial { color: #ffaa00; border-color: #775500; }
        .foia-link {
            color: #00ddff; text-decoration: none; border-bottom: 1px dotted #007799;
            transition: color 0.12s, background 0.12s;
        }
        .foia-link:hover { color: #66eeff; background: #001a22; }
        .foia-link::after { content: ' \2197'; color: #006688; font-size: 0.85em; }
        .foia-note { color: #557755; }

        /* handler chat */
        #chatLog { max-height: 46vh; overflow-y: auto; margin: 8px 0 14px; padding-right: 6px; }
        .chat-msg { margin: 7px 0; font-size: 1.2rem; line-height: 1.3; }
        .chat-msg.you { color: var(--dim); }
        .chat-msg.handler { color: #00ffaa; text-shadow: 0 0 8px rgba(0,200,120,0.5); }
        .chat-row { display: flex; gap: 8px; }
        .chat-row .btn { flex: 1; text-align: center; }

        /* ---------- PARANOIA TOAST ---------- */
        #toasts { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 9600; width: min(420px, 92vw); }
        .toast {
            background: rgba(30,0,0,0.95); border: 1px solid #aa0000; color: #ff8888;
            padding: 9px 14px; margin-top: 8px; font-size: 1.1rem; letter-spacing: 0.5px;
            box-shadow: 0 0 22px rgba(120,0,0,0.6);
            animation: toastIn 0.25s ease, glitch 0.6s 1;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* ---------- HUD HINT ---------- */
        .hint {
            position: fixed; bottom: 10px; left: 12px; z-index: 200;
            font-size: 0.95rem; color: #225522; pointer-events: none;
        }
        .zoom-ctrl { position: fixed; bottom: 12px; right: 12px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
        .zoom-ctrl .btn { width: 42px; text-align: center; padding: 6px 0; font-size: 1.3rem; }

        @media (max-width: 760px) {
            .title { font-size: 1.25rem; }
            .sanity-box, .sanity-track { min-width: 120px; width: 120px; }
            .layers .lbl { display: none; }
            .hint { display: none; }
            #directives { display: none; }
        }

        /* ---------- CLEARANCE / FILES HUD ---------- */
        .clearance-box { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; min-width: 150px; }
        .clearance-label { font-size: 0.9rem; color: #ffaa33; letter-spacing: 1px; }
        .clearance-label b { color: #ffcc66; text-shadow: 0 0 8px #885500; }
        .files-label { font-size: 0.78rem; color: #00aa88; letter-spacing: 1px; }
        .files-label b { color: #00ffcc; }
        .clearance-up { animation: clearflash 0.9s 1; }
        @keyframes clearflash {
            0%,100% { text-shadow: 0 0 8px #885500; }
            50% { color: #fff; text-shadow: 0 0 22px #ffcc00, 0 0 40px #ff8800; }
        }

        /* ---------- DREAD CANVAS (static + shadows) ---------- */
        #dread { position: fixed; inset: 0; pointer-events: none; z-index: 8998; opacity: 0; transition: opacity 1.2s; }

        /* ---------- LINK / FUSE HANDLE ---------- */
        .node-link {
            cursor: crosshair; flex-shrink: 0; width: 16px; height: 16px; line-height: 14px;
            text-align: center; font-size: 0.9rem; color: #00ddff; border: 1px solid #006688;
            background: #001318; border-radius: 2px; transition: all 0.12s;
        }
        .node-link:hover { color: #66eeff; border-color: #00ddff; box-shadow: 0 0 8px #00aacc; }
        .node.link-source { border-color: #00ddff !important; box-shadow: 0 0 30px #00aacc !important; }
        .node.link-source .node-link { background: #00ddff; color: #001318; }
        body.linking .node { cursor: crosshair; }
        body.linking .node:hover { border-color: #00ddff; box-shadow: 0 0 26px #00aacc; }

        /* player-fused edges */
        .edge-path.fused { stroke: #00ccff; stroke-dasharray: 3 4; opacity: 0.9; animation: dash 0.4s linear infinite; }
        .edge-label.fused { fill: #33ddff; }

        /* ---------- DIRECTIVES PANEL ---------- */
        #directives {
            position: fixed; top: 64px; left: 12px; z-index: 180; width: 246px;
            background: rgba(6,2,2,0.92); border: 2px solid #007755;
            box-shadow: 0 0 22px rgba(0,80,60,0.4); font-size: 0.95rem;
        }
        #directives .dir-head {
            padding: 5px 9px; background: rgba(0,30,24,0.7); border-bottom: 1px solid #007755;
            color: #00ffcc; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer;
        }
        #directives .dir-head small { color: #007766; }
        #directives .dir-body { padding: 4px 0; max-height: 50vh; overflow-y: auto; }
        #directives.collapsed .dir-body { display: none; }
        .dir-item {
            padding: 6px 10px; border-bottom: 1px dashed #053a30; line-height: 1.25;
            display: flex; gap: 7px; align-items: flex-start; color: #66ccaa;
        }
        .dir-item:last-child { border-bottom: 0; }
        .dir-check { flex-shrink: 0; color: #007766; }
        .dir-item.done { color: #035; text-decoration: line-through; opacity: 0.6; }
        .dir-item.done .dir-check { color: #00ff88; text-decoration: none; }
        .dir-reward { display: block; font-size: 0.8rem; color: #ffaa33; margin-top: 2px; }
        .dir-item.done .dir-reward { display: none; }

        /* ---------- DECISION / ENDGAME MODAL EXTRAS ---------- */
        .decision .doc-line { font-size: 1.3rem; }
        .choice-row { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
        .choice-row .btn { text-align: center; }
        .ending { text-align: center; }
        .ending h2 { font-size: 2.2rem; }
        .ending .verdict { color: #cc66ff; font-size: 1.5rem; text-shadow: 0 0 14px #6600aa; margin: 6px 0 18px; }
        .ending .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; margin: 16px 0; text-align: left; }
        .ending .stat-grid div { font-size: 1.1rem; color: #00bb88; }
        .ending .stat-grid b { color: #00ffcc; }
        .reveal-tag { color: #00ddff; font-size: 1.05rem; letter-spacing: 1px; margin: 4px 0 10px; }

        /* ---------- TYPEWRITER DOC REVEAL ---------- */
        .doc-tw .doc-line { opacity: 0; transform: translateY(3px); transition: opacity 0.15s, transform 0.15s; }
        .doc-tw .doc-line.on { opacity: 1; transform: none; }

        /* ---------- CIPHER INTERCEPT ---------- */
        .cipher-text {
            font-size: 1.45rem; letter-spacing: 2px; color: #ffaa00;
            background: #0a0600; border: 1px dashed #775500; padding: 12px 14px;
            margin: 12px 0; line-height: 1.45; word-wrap: break-word;
            transition: color 0.3s, border-color 0.3s;
        }
        .cipher-text.clean { color: #00ff88; border-color: #007744; text-shadow: 0 0 10px rgba(0,200,100,0.5); }
        .cipher-ctrl { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 12px 0; }
        .cipher-ctrl .rot { color: #00ddff; font-size: 1.35rem; min-width: 86px; text-align: center; }

        /* ---------- HANDLER INPUT ---------- */
        #handlerInput {
            flex: 2; min-width: 0; background: #020a06; border: 2px solid #00aa66;
            color: #00ffaa; font-family: 'VT323', monospace; font-size: 1.15rem;
            padding: 7px 10px; outline: none;
        }
        #handlerInput::placeholder { color: #066; }
        #handlerInput:focus { border-color: #00ffaa; box-shadow: 0 0 12px rgba(0,200,120,0.4); }

        /* ---------- CORRUPTED NODE (replay tension) ---------- */
        .node.corrupted { border-color: #cc00cc !important; }
        .node.corrupted .node-dot { background: #ff66ff; }
        .node.corrupted .node-tag::after { content: ' ▓CORRUPT'; color: #ff66ff; }
        .node.corrupted { animation: corruptpulse 1.1s infinite; }
        @keyframes corruptpulse {
            0%,100% { box-shadow: 0 0 16px rgba(120,0,120,0.7); }
            50% { box-shadow: 0 0 36px #cc00cc; }
        }

        /* ---------- INTEL HUD ---------- */
        .intel-label { font-size: 0.78rem; color: #cc8822; letter-spacing: 1px; }
        .intel-label b { color: #ffcc66; }
        .intel-flash { animation: clearflash 0.7s 1; }

        /* ---------- CHAIN BANNER ---------- */
        .chain-pop {
            position: fixed; top: 38%; left: 50%; transform: translate(-50%,-50%);
            z-index: 9700; pointer-events: none; color: #00ffcc; font-size: 2.6rem;
            letter-spacing: 4px; text-shadow: 0 0 24px #00aa88, 0 0 60px #00ffcc;
            animation: chainpop 1.4s ease forwards;
        }
        @keyframes chainpop {
            0% { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
            18% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
            30% { transform: translate(-50%,-50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%,-62%) scale(1.05); }
        }
    </style>
</head>
<body>
    <canvas id="dread"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- ================= HANDLER DIRECTIVES ================= -->
    <aside id="directives">
        <div class="dir-head" onclick="document.getElementById('directives').classList.toggle('collapsed')">
            <span>▸ HANDLER DIRECTIVES</span><small id="dirCount">0/0</small>
        </div>
        <div class="dir-body" id="dirBody"></div>
    </aside>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <h1 class="title">SHADOW ECHO <small>v6.0 // DECLASSIFIED</small></h1>
        <div class="header-right">
            <div class="layers">
                <span class="lbl">LAYER:</span>
                <button class="btn active" data-layer="surface"    onclick="toggleLayer('surface', this)">SURFACE</button>
                <button class="btn active" data-layer="deepstate"  onclick="toggleLayer('deepstate', this)">DEEP STATE</button>
                <button class="btn active" data-layer="mythic"     onclick="toggleLayer('mythic', this)">MYTHIC</button>
            </div>
            <div class="clearance-box">
                <span class="clearance-label" id="clearanceLabel">CLEARANCE <b>Lv.1</b> · SURFACE</span>
                <span class="files-label">DOCUMENTS <b><span id="filesNum">0</span>/<span id="filesTotal">0</span></b> RECOVERED</span>
                <span class="intel-label" id="intelLabel">INTEL <b><span id="intelNum">0</span></b> BANKED</span>
            </div>
            <div class="sanity-box">
                <span class="sanity-label">SANITY <span id="sanityNum">83</span>%</span>
                <div class="sanity-track"><div class="sanity-fill" id="sanityFill" style="width:83%"></div></div>
            </div>
            <button class="btn" id="linkBtn" onclick="toggleLinkMode()" title="Fuse two signals — risk/reward. Reveals hidden links.">⊕ FUSE</button>
            <button class="btn" id="audioBtn" onclick="toggleAudio()" title="Procedural signal bed — drone, static, teletype">♪ SIGNAL OFF</button>
            <button class="btn" onclick="transmit()">TRANSMIT</button>
            <button class="btn red" onclick="reboot()">REBOOT</button>
        </div>
    </header>

    <!-- ================= CANVAS ================= -->
    <div id="viewport">
        <div id="world">
            <div id="grid"></div>
            <svg id="edges"></svg>
            <!-- nodes injected here -->
        </div>
    </div>

    <div class="hint">DRAG to pan • SCROLL / pinch to zoom • CLICK node to open • ⊕ on a node to FUSE signals</div>
    <div class="zoom-ctrl">
        <button class="btn" onclick="zoomBy(1.2)">+</button>
        <button class="btn" onclick="zoomBy(0.8)">&minus;</button>
        <button class="btn" onclick="resetView()" style="font-size:0.9rem">FIT</button>
    </div>

    <!-- ================= MODAL ================= -->
    <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal"></div>
    </div>

    <div id="toasts"></div>

    <script>
    /* =====================================================================
       OPERATION SHADOW ECHO — SPATIAL OPS MAP
       Self-contained. Zero dependencies. CRT field-station aesthetic.
       ===================================================================== */

    // ---------- LORE / NODE DATA ----------
    // layer: surface | deepstate | mythic
    // type:  op | doc | handler | recover | terminal
    // Each node may carry a `sources` array — its FOIA trail. Entry shapes:
    //   { s:'open',    label, url, note? }  → real, declassified, public record
    //   { s:'partial', label, url?, note? } → released but redacted / fragmentary
    //   { s:'denied',  label }              → no responsive records (or never was)
    const NODES = [
      // ---- SURFACE ----
      { id:'stlouis', layer:'surface', type:'doc', x:-520, y:-40, drain:6,
        tag:'US ARMY CHEM CORPS', title:'ST. LOUIS DISPERSAL', sub:'Operation Large Area Coverage // 1953-54',
        doc:['[U.S. ARMY CHEMICAL CORPS — 1953-54]',
             'Operation: Large Area Coverage Dispersal.',
             'Zinc cadmium sulfide sprayed from rooftops and blowers',
             'over the Pruitt-Igoe towers and residential St. Louis.',
             'Repeated again 1963-65. Residents were ~70% Black.',
             '',
             'Civilians told it was a "smoke screening" study to hide',
             'the city from Soviet observation. The Army confirmed the',
             'tests only in 1994, under Congressional pressure.',
             '',
             '#A 1997 National Academies review concluded the public was',
             '#exposed without consent. The dose debate continues.'],

              'They never needed to catch you. They only needed you to keep opening doors.'] },
      ARCHIVIST: { name:'THE ARCHIVIST', verdict:'You mapped the whole network — and lived.',
        body:['Every dossier recovered. Every real pattern fused.',
              'You walk out with the complete case file: what is on the public record, and the exact shape of the holes where the rest burned.',
              'The myth was the index all along. You read it cover to cover.'] },
      WHISTLEBLOWER: { name:'THE WHISTLEBLOWER', verdict:'You got enough out to matter.',
        body:['Not everything. But enough real, filed, public record to make the silence expensive.',
              'You file one last request before you go dark. Twenty working days. They have to answer.',
              'Somewhere a redacted page is already being un-redacted.'] },
      FORGOTTEN: { name:'THE FORGOTTEN', verdict:'You opened the last door too soon.',
        body:['You reached the end before you understood the middle.',
              'The pattern was right there in the connections you never fused.',
              'The transmission ends. No one will remember you filed anything at all.'] },
    };
    function triggerEndgame(cause) {
      if (gameOver) { showEnding(endingKey); return; }
      gameOver = true;
      const recovered = [...discovered].filter(id => DOC_NODES.includes(id)).length;
      const patterns = playerConnections.filter(e => FUSIONS[[e.s,e.t].sort().join('|')]).length;

      if (cause === 'zero') endingKey = 'ABSORBED';
      else if (recovered >= 7 && patterns >= 3) endingKey = 'ARCHIVIST';
      else if (patterns >= 1 || recovered >= 4) endingKey = 'WHISTLEBLOWER';
      else endingKey = 'FORGOTTEN';

      meta.runs++;
      meta.bestIntel = Math.max(meta.bestIntel, intel);
      if (!meta.endingsSeen.includes(endingKey)) meta.endingsSeen.push(endingKey);
      saveMeta();

      checkMissions();
      audioPanic();
      showEnding(endingKey);
      save();
    }
    function showEnding(key) {
      const ending = ENDINGS[key];
      if (!ending) return;
      const recovered = [...discovered].filter(id => DOC_NODES.includes(id)).length;
      const fused = playerConnections.length;
      const patterns = playerConnections.filter(e => FUSIONS[[e.s,e.t].sort().join('|')]).length;
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <div class="ending">
          <h2>FINAL TRANSMISSION</h2>
          <div class="verdict">${ending.name}</div>
          ${ending.body.map(l=>`<div class="doc-line">${l}</div>`).join('')}
          <div class="reveal-tag" style="margin-top:14px">${ending.verdict}</div>
          <div class="stat-grid">
            <div>SANITY: <b>${sanity}%</b></div>
            <div>CLEARANCE: <b>Lv.${clearance}</b></div>
            <div>DOCUMENTS: <b>${recovered}/${DOC_NODES.length}</b></div>
            <div>SIGNALS FUSED: <b>${fused}</b></div>
            <div>PATTERNS LOCKED: <b>${patterns}</b></div>
            <div>DIRECTIVES: <b>${completedMissions.size}/${MISSIONS.length}</b></div>
            <div>INTEL BANKED: <b>${intel}</b></div>
            <div>INTERCEPTS DECODED: <b>${decrypts}</b></div>
            <div>RECORDS VERIFIED: <b>${quizDone.size}/${Object.keys(QUIZ).length}</b></div>
            <div>BEST CHAIN: <b>×${chainBest}</b></div>
          </div>
          <div class="reveal-tag" style="color:#ffaa33">RUN #${meta.runs} · BEST INTEL ${meta.bestIntel} · ENDINGS SEEN ${meta.endingsSeen.length}/4</div>
          <button class="btn red" style="margin-top:14px;width:100%;text-align:center" onclick="reboot()">▶ RUN OPERATION AGAIN</button>
        </div>`;
      showModal();
    }

    // ---------- RENDER NODES ----------
    function buildNodes() {
      NODES.forEach(n => {
        const el = document.createElement('div');
        el.className = 'node';
        el.dataset.type = n.type;
        el.dataset.layer = n.layer;
        el.dataset.id = n.id;
        const drainPct = Math.min(100, Math.abs(n.drain) * 6);
        const drainColor = n.drain < 0 ? '#00ccff' : '#cc0000';
        el.innerHTML = `
          <div class="node-head">
            <span class="node-dot"></span>
            <span class="node-tag">${n.tag}</span>
            <span class="node-link" title="Fuse signal from this node">⊕</span>
          </div>
          <div class="node-body">
            <div class="node-title">${n.title}</div>
            <div class="node-sub">${n.sub}</div>
            <div class="node-drain" title="${n.drain<0?'RESTORES':'DRAINS'} ${Math.abs(n.drain)} sanity">
              <span style="width:${drainPct}%;background:${drainColor};box-shadow:0 0 6px ${drainColor}"></span>
            </div>
          </div>`;
        world.appendChild(el);
        nodeEls[n.id] = el;
        positionNode(n);
        attachNodeDrag(el, n);
        const linkBtn = el.querySelector('.node-link');
        linkBtn.addEventListener('pointerdown', e => e.stopPropagation());
        linkBtn.addEventListener('pointerup', e => e.stopPropagation());
        linkBtn.addEventListener('click', e => { e.stopPropagation(); onLinkHandle(n); });
        applyNodeLock(n);
      });
    }

    // Mythic nodes stay ENCRYPTED until clearance is earned.
    function applyNodeLock(n) {
      const el = nodeEls[n.id];
      if (!el) return;
      const locked = isLocked(n);
      el.dataset.locked = locked ? '1' : '0';
      const titleEl = el.querySelector('.node-title');
      const subEl = el.querySelector('.node-sub');
      if (locked) {
        titleEl.textContent = '▓▓ ENCRYPTED ▓▓';
        titleEl.style.color = '#553355';
        subEl.textContent = 'CLEARANCE Lv.2 REQUIRED';
        el.style.filter = 'grayscale(0.6) brightness(0.7)';
      } else {
        titleEl.textContent = n.title;
        titleEl.style.color = '';
        subEl.textContent = n.sub;
        el.style.filter = '';
      }
    }
    function isLocked(n) { return n.layer === 'mythic' && clearance < 2 && !discovered.has(n.id); }
    function positionNode(n) {
      nodeEls[n.id].style.transform = `translate(${n.x}px, ${n.y}px)`;
    }

    // ---------- RENDER EDGES ----------
    const NODE_W = 210, NODE_H = 118, GRID_OFFSET = 5000;
    function renderEdges() {
      edgesSvg.innerHTML = '';
      const all = EDGES.concat(playerConnections.map(e => ({ ...e, fused: true })));
      all.forEach(e => {
        const a = NODES.find(n => n.id === e.s), b = NODES.find(n => n.id === e.t);
        if (!a || !b) return;
        const visible = activeLayers.has(a.layer) && activeLayers.has(b.layer);
        const ax = a.x + NODE_W/2 + GRID_OFFSET, ay = a.y + NODE_H/2 + GRID_OFFSET;
        const bx = b.x + NODE_W/2 + GRID_OFFSET, by = b.y + NODE_H/2 + GRID_OFFSET;
        const mx = (ax + bx) / 2, my = (ay + by) / 2;
        // slight curve via quadratic control offset perpendicular
        const cx = mx + (by - ay) * 0.12, cy = my - (bx - ax) * 0.12;
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d', `M ${ax} ${ay} Q ${cx} ${cy} ${bx} ${by}`);
        path.setAttribute('class', 'edge-path' + (e.hot ? ' hot' : '') + (e.fused ? ' fused' : ''));
        path.style.opacity = visible ? '' : '0.08';
        edgesSvg.appendChild(path);
        if (e.label && visible) {
          const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
          lbl.setAttribute('x', cx); lbl.setAttribute('y', cy);
          lbl.setAttribute('class', 'edge-label' + (e.fused ? ' fused' : ''));
          lbl.textContent = e.label;
          edgesSvg.appendChild(lbl);
        }
      });
    }

    // ---------- LAYERS ----------
    function toggleLayer(layer, btn) {
      if (activeLayers.has(layer)) activeLayers.delete(layer); else activeLayers.add(layer);
      btn.classList.toggle('active');
      NODES.forEach(n => {
        const vis = activeLayers.has(n.layer);
        nodeEls[n.id].style.opacity = vis ? '1' : '0.12';
        nodeEls[n.id].style.pointerEvents = vis ? 'auto' : 'none';
      });
      renderEdges();
    }

    // ---------- VIEW TRANSFORM ----------
    function applyView() {
      world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    }
    function zoomBy(factor, cx, cy) {
      cx = cx ?? window.innerWidth/2; cy = cy ?? window.innerHeight/2;
      const newScale = Math.max(0.25, Math.min(2.5, view.scale * factor));
      const k = newScale / view.scale;
      view.x = cx - (cx - view.x) * k;
      view.y = cy - (cy - view.y) * k;
      view.scale = newScale;
      applyView(); save();
    }
    function resetView() {
      // fit all visible nodes
      const vis = NODES.filter(n => activeLayers.has(n.layer));
      const list = vis.length ? vis : NODES;
      let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
      list.forEach(n => { minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+NODE_W); maxY=Math.max(maxY,n.y+NODE_H); });
      const pad = 80, w = maxX-minX+pad*2, h = maxY-minY+pad*2;
      const scale = Math.max(0.3, Math.min(1.2, Math.min(window.innerWidth/w, (window.innerHeight-60)/h)));
      view.scale = scale;
      view.x = (window.innerWidth - (minX+maxX)*scale)/2;
      view.y = (window.innerHeight + 60 - (minY+maxY)*scale)/2;
      applyView(); save();
    }

    // ---------- PAN (viewport drag) ----------
    let panning = false, panStart = null, panMoved = false;
    viewport.addEventListener('pointerdown', e => {
      if (e.target.closest('.node')) return;
      panning = true; panMoved = false;
      panStart = { x: e.clientX - view.x, y: e.clientY - view.y };
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
    });
    viewport.addEventListener('pointermove', e => {
      if (!panning) return;
      view.x = e.clientX - panStart.x;
      view.y = e.clientY - panStart.y;
      panMoved = true;
      applyView();
    });
    viewport.addEventListener('pointerup', e => {
      panning = false; viewport.classList.remove('panning');
      if (panMoved) save();
    });
    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      zoomBy(e.deltaY < 0 ? 1.12 : 0.89, e.clientX, e.clientY);
    }, { passive: false });

    // pinch zoom
    let pinch = null;
    viewport.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        pinch = { d: touchDist(e), cx: (e.touches[0].clientX+e.touches[1].clientX)/2, cy: (e.touches[0].clientY+e.touches[1].clientY)/2 };
      }
    }, { passive: false });
    viewport.addEventListener('touchmove', e => {
      if (pinch && e.touches.length === 2) {
        e.preventDefault();
        const d = touchDist(e);
        zoomBy(d / pinch.d, pinch.cx, pinch.cy);
        pinch.d = d;
      }
    }, { passive: false });
    viewport.addEventListener('touchend', () => { pinch = null; });
    function touchDist(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    // ---------- NODE DRAG + CLICK ----------
    function attachNodeDrag(el, n) {
      let dragging = false, moved = false, start = null;
      el.addEventListener('pointerdown', e => {
        e.stopPropagation();
        dragging = true; moved = false;
        start = { px: e.clientX, py: e.clientY, nx: n.x, ny: n.y };
        el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = (e.clientX - start.px) / view.scale;
        const dy = (e.clientY - start.py) / view.scale;
        if (Math.abs(e.clientX-start.px) + Math.abs(e.clientY-start.py) > 4) moved = true;
        n.x = start.nx + dx; n.y = start.ny + dy;
        positionNode(n);
        renderEdges();
      });
      el.addEventListener('pointerup', e => {
        dragging = false; el.classList.remove('dragging');
        if (moved) { save(); }
        else openNode(n);
      });
    }

    // ---------- NODE INTERACTION ----------
    function openNode(n) {
      if (gameOver) { showEnding(endingKey); return; }
      if (isLocked(n)) {
        toast('INSUFFICIENT CLEARANCE. Recover more documents to reach Lv.2.');
        triggerStaticBurst(0.7);
        return;
      }
      // The last door is the endgame, not a dossier.
      if (n.type === 'terminal') { return triggerEndgame('opened'); }

      const firstTime = !discovered.has(n.id);
      const corrupted = n.id === corruptedId && firstTime;
      drainSanity(corrupted ? n.drain * 2 : n.drain);
      if (n.doc) { discovered.add(n.id); }
      maybeParanoia();
      if (n.type === 'recover') {
        handlerBeep();            // soft tone — the static drops here
      } else {
        teletypeBurst(3 + Math.round(Math.abs(n.drain) / 4));
        triggerStaticBurst(Math.min(1.4, Math.abs(n.drain) / 9));
      }
      if (firstTime && n.doc) {
        addIntel(corrupted ? 20 : 10);
        if (corrupted) {
          toast('CORRUPTED DOSSIER RECOVERED. Double drain, double intel. It remembers being burned.');
          nodeEls[n.id].classList.remove('corrupted');
          triggerStaticBurst(1.6);
        }
        registerChain(n);
        updateProgress(); checkMissions();
      }
      if (n.type === 'handler') return openHandler(n);
      if (n.type === 'recover') { toast("Signal dead zone. Sanity recovered."); }
      openDoc(n);
    }

    // ---------- PROGRESSION / CLEARANCE ----------
    function updateProgress() {
      // clearance climbs with documents recovered
      const recovered = [...discovered].filter(id => DOC_NODES.includes(id)).length;
      const newClear = recovered >= 7 ? 3 : recovered >= 3 ? 2 : 1;
      const leveledUp = newClear > clearance;
      clearance = Math.max(clearance, newClear);

      document.getElementById('filesNum').textContent = recovered;
      const lbl = document.getElementById('clearanceLabel');
      lbl.innerHTML = `CLEARANCE <b>Lv.${clearance}</b> · ${CLEARANCE_NAMES[clearance]}`;

      if (leveledUp) {
        lbl.classList.remove('clearance-up'); void lbl.offsetWidth; lbl.classList.add('clearance-up');
        toast(`CLEARANCE ELEVATED → Lv.${clearance} ${CLEARANCE_NAMES[clearance]}.`);
        handlerBeep();
        if (clearance >= 2) {
          NODES.filter(n => n.layer === 'mythic').forEach(applyNodeLock);
          toast('MYTHIC LAYER DECRYPTED. The arcana overlay is live.');
        }
      }
      save();
    }

    function checkMissions() {
      let changed = false;
      MISSIONS.forEach(m => {
        if (completedMissions.has(m.id)) return;
        if (m.check()) {
          completedMissions.add(m.id);
          changed = true;
          toast(`DIRECTIVE COMPLETE: ${m.text}`);
          handlerBeep();
          if (m.reward) m.reward();
        }
      });
      if (changed) { renderDirectives(); save(); }
    }

    function renderDirectives() {
      const body = document.getElementById('dirBody');
      body.innerHTML = MISSIONS.map(m => {
        const done = completedMissions.has(m.id);
        return `<div class="dir-item ${done?'done':''}">
          <span class="dir-check">${done?'☑':'☐'}</span>
          <span>${m.text}<span class="dir-reward">⮡ ${m.rewardText}</span></span>
        </div>`;
      }).join('');
      document.getElementById('dirCount').textContent = `${completedMissions.size}/${MISSIONS.length}`;
    }

    // ---------- FUSE SIGNALS (player-made connections) ----------
    function toggleLinkMode() {
      // Manual arm/disarm of fuse mode. Clears any pending source.
      const active = document.body.classList.toggle('linking');
      document.getElementById('linkBtn').classList.toggle('active', active);
      if (!active) clearLinkSource();
      else toast('FUSE MODE ARMED. Pick a source signal (⊕), then a target.');
    }
    function clearLinkSource() {
      if (linkFrom && nodeEls[linkFrom]) nodeEls[linkFrom].classList.remove('link-source');
      linkFrom = null;
    }
    function onLinkHandle(n) {
      if (gameOver || isLocked(n)) return;
      document.body.classList.add('linking');
      document.getElementById('linkBtn').classList.add('active');
      if (!linkFrom) {
        linkFrom = n.id;
        nodeEls[n.id].classList.add('link-source');
        handlerBeep();
        toast(`SIGNAL ORIGIN LOCKED: ${n.title}. Pick a target ⊕.`);
        return;
      }
      if (linkFrom === n.id) { clearLinkSource(); toast('Origin released.'); return; }
      fuseSignals(linkFrom, n.id);
      clearLinkSource();
    }
    function alreadyConnected(a, b) {
      const all = EDGES.concat(playerConnections);
      return all.some(e => (e.s===a&&e.t===b) || (e.s===b&&e.t===a));
    }
    function fuseSignals(aId, bId) {
      const a = NODES.find(n=>n.id===aId), b = NODES.find(n=>n.id===bId);
      if (!a || !b) return;
      if (alreadyConnected(aId, bId)) { toast('SIGNALS ALREADY FUSED.'); triggerStaticBurst(0.4); return; }

      const key = [aId, bId].sort().join('|');
      const lore = FUSIONS[key];
      playerConnections.push({ s:aId, t:bId, label: lore ? '[PATTERN]' : '[NOISE]' });
      renderEdges();
      triggerStaticBurst(1.1);
      teletypeBurst(8, 0.04);

      if (lore) {
        // Meaningful pattern — reveal hidden lore, restore sanity (reward).
        setSanity(sanity + 8);
        handlerBeep();
        showFuseResult(true, `${a.title}  ⟶  ${b.title}`, lore, '+8 SANITY · PATTERN RECOGNIZED');
      } else {
        // Random fusion — risk/reward paranoia roll.
        const lucky = Math.random() > 0.5;
        if (lucky) {
          setSanity(sanity + 4);
          showFuseResult(true, `${a.title}  ⟶  ${b.title}`,
            'Signals cross-talk into a faint, coherent hum. No clean pattern — but the noise steadies you for a moment.',
            '+4 SANITY · WEAK SIGNAL');
        } else {
          setSanity(sanity - 12);
          triggerStaticBurst(1.8);
          showFuseResult(false, `${a.title}  ⟶  ${b.title}`,
            'The lines feed back. A burst of white noise, a voice that is almost your own. Forcing a connection that was not there costs you.',
            '−12 SANITY · PARANOIA SPIKE');
          maybeParanoia();
        }
      }
      checkMissions();
      save();
    }
    function showFuseResult(good, pair, body, badge) {
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <h2 style="color:${good?'#00ddff':'#ff3333'}">${good?'⊕ SIGNAL FUSED':'⊗ SIGNAL BACKLASH'}</h2>
        <div class="reveal-tag">${pair}</div>
        <div class="doc-line" style="color:${good?'#00ddaa':'#ff8888'}">${body}</div>
        <div class="reveal-tag" style="color:${good?'#00ff88':'#ff5555'};margin-top:14px">${badge}</div>
        <button class="btn red" style="margin-top:18px;width:100%;text-align:center" onclick="closeModal()">CLOSE CHANNEL</button>`;
      showModal();
    }

    function openDoc(n) {
      const modal = document.getElementById('modal');
      const lines = (n.doc || ['CLASSIFIED. MEMORY LEAK IN PROGRESS.']).map(l => {
        if (l.startsWith('!')) return `<div class="doc-line warn">${l.slice(1)}</div>`;
        if (l.startsWith('#')) return `<div class="doc-line warn" style="color:#00ddaa">${l.slice(1)}</div>`;
        if (l === '') return `<div class="doc-line">&nbsp;</div>`;
        return `<div class="doc-line">${l}</div>`;
      }).join('');
      modal.innerHTML = `
        <h2>${n.title}</h2>
        <div class="doc-tw" id="docTw">${lines}</div>
        ${quizBlock(n)}
        ${foiaBlock(n)}
        <button class="btn red" style="margin-top:18px;width:100%;text-align:center" onclick="closeModal()">CLOSE CHANNEL</button>`;
      showModal();
      // typewriter reveal — click the doc body to skip ahead
      const tw = document.getElementById('docTw');
      const docLines = tw.querySelectorAll('.doc-line');
      docLines.forEach((el, i) => setTimeout(() => {
        if (!el.classList.contains('on')) {
          el.classList.add('on');
          if (i % 2 === 0) playTeletypeClick();
        }
      }, 70 * i + 120));
      tw.addEventListener('click', () => docLines.forEach(el => el.classList.add('on')), { once: true });
    }

    // ---------- FIELD VERIFICATION (quiz) ----------
    function quizBlock(n) {
      if (!QUIZ[n.id] || quizDone.has(n.id)) return '';
      return `<button class="btn" style="margin-top:16px;width:100%;text-align:center;border-color:#006688;color:#00ddff"
        onclick="openQuiz('${n.id}')">▸ VERIFY THE RECORD — field check (+10 INTEL)</button>`;
    }
    function openQuiz(id) {
      const q = QUIZ[id];
      if (!q || quizDone.has(id)) return;
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <h2 style="color:#00ddff">FIELD VERIFICATION</h2>
        <div class="reveal-tag">One question. The real record only. Guessing wrong costs you.</div>
        <div class="doc-line" style="margin:10px 0">${q.q}</div>
        <div class="choice-row">
          ${q.a.map((opt, i) => `<button class="btn" onclick="answerQuiz('${id}',${i})">${opt}</button>`).join('')}
        </div>`;
      showModal();
    }
    function answerQuiz(id, i) {
      const q = QUIZ[id];
      quizDone.add(id);
      const right = i === q.correct;
      if (right) { addIntel(10); setSanity(sanity + 4); handlerBeep(); }
      else { setSanity(sanity - 6); triggerStaticBurst(1.2); }
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <h2 style="color:${right ? '#00ff88' : '#ff3333'}">${right ? '✔ VERIFIED' : '✘ MISFILED'}</h2>
        <div class="doc-line">${right ? 'Correct. The record holds.' : 'Wrong — the record says: ' + q.a[q.correct]}</div>
        <div class="doc-line warn" style="color:#00ddaa;margin-top:10px">${q.note}</div>
        <div class="reveal-tag" style="margin-top:14px;color:${right ? '#00ff88' : '#ff5555'}">
          ${right ? '+10 INTEL · +4 SANITY' : '−6 SANITY · the truth was checkable'}</div>
        <button class="btn red" style="margin-top:14px;width:100%;text-align:center" onclick="closeModal()">CLOSE CHANNEL</button>`;
      checkMissions();
      save();
    }

    // ---------- ENCRYPTED INTERCEPTS (cipher minigame) ----------
    function caesar(s, k) {
      return s.replace(/[A-Z]/g, c => String.fromCharCode(((c.charCodeAt(0) - 65 + k) % 26 + 26) % 26 + 65));
    }
    let interceptQueue = null, activeIntercept = null, trialShift = 0;
    function maybeIntercept() {
      if (gameOver || modalOpen()) return;
      if (!interceptQueue) interceptQueue = [...INTERCEPTS].sort(() => Math.random() - 0.5);
      if (!interceptQueue.length) return;
      const chance = 0.20 + discovered.size * 0.02;
      if (Math.random() > chance) return;
      activeIntercept = interceptQueue.shift();
      trialShift = 0;
      triggerStaticBurst(1);
      teletypeBurst(10, 0.04);
      renderIntercept();
      showModal();
    }
    function renderIntercept() {
      const it = activeIntercept;
      const decoded = caesar(caesar(it.plain, it.shift), -trialShift);
      const clean = (trialShift % 26 + 26) % 26 === it.shift;
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <h2 style="color:#ffaa00">⚠ ENCRYPTED INTERCEPT</h2>

    // Render a node's FOIA trail — real declassified links open in a new tab;

    function foiaBlock(n) {
      if (!n.sources || !n.sources.length) return '';
      const items = n.sources.map(s => {
        const note = s.note ? ` <span class="foia-note">— ${s.note}</span>` : '';
        if (s.s === 'denied') {
          return `<div class="foia-item"><span class="foia-badge denied">REQUEST DENIED</span>
            <span class="foia-note">${s.label}</span></div>`;
        }
        const badge = s.s === 'partial' ? 'partial' : 'open';
        const label = s.s === 'partial' ? 'PARTIAL RELEASE' : 'DECLASSIFIED';
        const body = s.url
          ? `<a class="foia-link" href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label}</a>${note}`
          : `<span class="foia-note">${s.label}${s.note ? ' — ' + s.note : ''}</span>`;
        return `<div class="foia-item"><span class="foia-badge ${badge}">${label}</span><span>${body}</span></div>`;
      }).join('');
      return `<div class="doc-foia"><div class="foia-head">▸ FOIA TRAIL // FILED REQUESTS</div>${items}</div>`;

    /* =====================================================================
       AUDIO ENGINE — procedural Web Audio. No assets. Sanity-reactive.
       Bed:      low detuned drone + band-passed static hiss, through a
                 waveshaper that bites harder as sanity falls.
       Triggers: teletype clicks, static bursts, handler beeps.
       Autoplay-safe: nothing sounds until a user gesture enables it.
       ===================================================================== */
    const AUDIO_KEY = 'shadow-echo-audio';
    const AUDIO = {
      ctx: null, on: false, started: false,
      master: null, bedGain: null, shaper: null,
      droneA: null, droneB: null, droneFilter: null,
      noiseSrc: null, noiseFilter: null, noiseGain: null,
    };

    function makeNoiseBuffer(ctx, dur = 2) {
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return buf;
    }
    function makeDistortionCurve(k = 0) {
      const n = 256, curve = new Float32Array(n);
      const deg = Math.PI / 180;
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = k <= 0 ? x : ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    // Build the persistent ambient bed once (oscillators can't be restarted).
    function startAudioBed() {
      if (AUDIO.started) return;
      const ctx = AUDIO.ctx;
      AUDIO.started = true;

      const master = ctx.createGain();
      master.gain.value = 0.0001;          // ramped up in enableAudio()
      master.connect(ctx.destination);
      AUDIO.master = master;

      const shaper = ctx.createWaveShaper();
      shaper.curve = makeDistortionCurve(0);
      shaper.oversample = '2x';
      shaper.connect(master);
      AUDIO.shaper = shaper;

      const bedGain = ctx.createGain();
      bedGain.gain.value = 1;
      bedGain.connect(shaper);
      AUDIO.bedGain = bedGain;

      // drone — two near-detuned sines for a slow, uneasy beat
      const droneFilter = ctx.createBiquadFilter();
      droneFilter.type = 'lowpass';
      droneFilter.frequency.value = 220;
      const droneGain = ctx.createGain();
      droneGain.gain.value = 0.09;
      droneFilter.connect(droneGain).connect(bedGain);
      AUDIO.droneFilter = droneFilter;

      const droneA = ctx.createOscillator();
      droneA.type = 'sine'; droneA.frequency.value = 45;
      const droneB = ctx.createOscillator();
      droneB.type = 'sine'; droneB.frequency.value = 45.4; // ~0.4Hz beat
      droneA.connect(droneFilter); droneB.connect(droneFilter);
      droneA.start(); droneB.start();
      AUDIO.droneA = droneA; AUDIO.droneB = droneB;

      // static hiss — looping band-passed white noise
      const noiseSrc = ctx.createBufferSource();
      noiseSrc.buffer = makeNoiseBuffer(ctx, 2);
      noiseSrc.loop = true;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 2400;
      noiseFilter.Q.value = 0.5;
      const noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.03;
      noiseSrc.connect(noiseFilter).connect(noiseGain).connect(bedGain);
      noiseSrc.start();
      AUDIO.noiseSrc = noiseSrc; AUDIO.noiseFilter = noiseFilter; AUDIO.noiseGain = noiseGain;

      updateSanityAudio(sanity);
    }

    async function enableAudio() {
      if (!AUDIO.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { toast('AUDIO SUBSYSTEM UNAVAILABLE.'); return; }
        AUDIO.ctx = new AC();
      }
      try { await AUDIO.ctx.resume(); } catch (e) { /* gesture required */ }
      startAudioBed();
      AUDIO.on = true;
      const t = AUDIO.ctx.currentTime, g = AUDIO.master.gain;
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(0.0001, g.value), t);
      g.exponentialRampToValueAtTime(0.9, t + 1.2);
      localStorage.setItem(AUDIO_KEY, 'live');
      reflectAudioBtn();
    }
    function muteAudio() {
      AUDIO.on = false;
      if (AUDIO.ctx && AUDIO.master) {
        const t = AUDIO.ctx.currentTime, g = AUDIO.master.gain;
        g.cancelScheduledValues(t);
        g.setValueAtTime(g.value, t);
        g.exponentialRampToValueAtTime(0.0001, t + 0.4);
      }
      localStorage.setItem(AUDIO_KEY, 'muted');
      reflectAudioBtn();
    }
    function toggleAudio() {
      if (AUDIO.on) { muteAudio(); toast('SIGNAL JAMMED.'); }
      else { enableAudio(); toast('SIGNAL LIVE. THE STATIC IS LISTENING.'); }
    }
    function reflectAudioBtn() {
      const b = document.getElementById('audioBtn');
      if (!b) return;
      b.textContent = AUDIO.on ? '♪ SIGNAL LIVE' : '♪ SIGNAL OFF';
      b.classList.toggle('active', AUDIO.on);
    }

    function audioReady() { return AUDIO.on && AUDIO.ctx && AUDIO.master; }

    // ---- transient triggers (one-shot nodes, auto-collected after stop) ----
    function playTeletypeClick() {
      if (!audioReady()) return;
      const ctx = AUDIO.ctx, t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = 1700 + Math.random() * 700;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 800;
      osc.connect(hp).connect(g).connect(AUDIO.master);
      osc.start(t); osc.stop(t + 0.06);
    }
    function teletypeBurst(count = 6, gap = 0.055) {
      if (!audioReady()) return;
      for (let i = 0; i < count; i++) {
        setTimeout(playTeletypeClick, i * gap * 1000 + Math.random() * 18);
      }
    }
    function triggerStaticBurst(intensity = 1) {
      if (!audioReady()) return;
      const ctx = AUDIO.ctx, t = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = makeNoiseBuffer(ctx, 0.35);
      const g = ctx.createGain();
      const peak = Math.min(0.5, 0.16 * intensity);
      g.gain.setValueAtTime(peak, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 600;
      src.connect(hp).connect(g).connect(AUDIO.master);
      src.start(t); src.stop(t + 0.4);
    }
    function handlerBeep() {
      if (!audioReady()) return;
      const ctx = AUDIO.ctx, t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420 + Math.random() * 140, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(g).connect(AUDIO.master);
      osc.start(t); osc.stop(t + 0.2);
    }

    // ---- sanity drives the mood of the bed (lower = louder, muddier, biting) ----
    function updateSanityAudio(v) {
      if (!AUDIO.started || !AUDIO.ctx) return;
      const ctx = AUDIO.ctx, t = ctx.currentTime;
      const dread = 1 - Math.max(0, Math.min(1, v / 100)); // 0 = sane, 1 = gone
      AUDIO.noiseGain.gain.setTargetAtTime(0.025 + dread * 0.12, t, 1.5);
      AUDIO.noiseFilter.frequency.setTargetAtTime(2600 - dread * 1400, t, 1.5);
      AUDIO.droneFilter.frequency.setTargetAtTime(240 - dread * 150, t, 1.5);
      AUDIO.droneB.detune.setTargetAtTime(dread * -45, t, 1.5);
      AUDIO.shaper.curve = makeDistortionCurve(dread > 0.6 ? (dread - 0.6) * 60 : 0);
    }
    function audioPanic() {
      if (!audioReady()) return;
      const ctx = AUDIO.ctx, t = ctx.currentTime;
      AUDIO.shaper.curve = makeDistortionCurve(80);
      AUDIO.droneA.frequency.exponentialRampToValueAtTime(28, t + 2);
      AUDIO.droneB.detune.setTargetAtTime(-120, t, 0.5);
      AUDIO.noiseGain.gain.setTargetAtTime(0.22, t, 0.8);
      triggerStaticBurst(2.5);
    }

    /* =====================================================================
       DREAD ENGINE — canvas grain + creeping shadow figures.
       Intensity scales with lost sanity. Cheap: throttled, only draws when
       there is dread to render.
       ===================================================================== */
    const dreadCanvas = document.getElementById('dread');
    const dctx = dreadCanvas.getContext('2d');
    let dreadLevel = 0;          // 0 sane → 1 gone
    const figures = [];          // shadowy silhouettes lurking at the edges
    function sizeDread() { dreadCanvas.width = innerWidth; dreadCanvas.height = innerHeight; }
    sizeDread();
    addEventListener('resize', sizeDread);

    function updateDread(v) {
      dreadLevel = 1 - Math.max(0, Math.min(1, v/100));
      dreadCanvas.style.opacity = (dreadLevel * 0.8).toFixed(3);
    }
    function spawnFigure() {
      const side = Math.random() < 0.5 ? 0 : 1;
      figures.push({
        x: side ? innerWidth - 40 - Math.random()*80 : 40 + Math.random()*80,
        y: innerHeight * (0.4 + Math.random()*0.5),
        w: 28 + Math.random()*26, h: 90 + Math.random()*70,
        life: 0, max: 120 + Math.random()*120,
      });
    }
    let dreadTick = 0;
    function dreadLoop() {
      requestAnimationFrame(dreadLoop);
      dreadTick++;
      if (dreadTick % 4 !== 0) return;          // ~15fps
      const W = dreadCanvas.width, H = dreadCanvas.height;
      dctx.clearRect(0, 0, W, H);
      if (dreadLevel < 0.04) { figures.length = 0; return; }

      // static grain — count scales with dread
      const grains = Math.floor(dreadLevel * 900);
      dctx.fillStyle = 'rgba(180,0,0,0.5)';
      for (let i = 0; i < grains; i++) {
        const r = Math.random();
        dctx.fillStyle = r < 0.7 ? 'rgba(120,0,0,0.5)' : r < 0.9 ? 'rgba(0,120,0,0.4)' : 'rgba(180,180,180,0.4)';
        dctx.fillRect(Math.random()*W, Math.random()*H, 2, 2);
      }

      // creeping red haze low-sanity
      if (dreadLevel > 0.55) {
        const g = dctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.75);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, `rgba(120,0,0,${(dreadLevel-0.55)*0.5})`);
        dctx.fillStyle = g; dctx.fillRect(0, 0, W, H);
      }

      // shadow figures — only when things are bad, occasionally
      if (dreadLevel > 0.45 && figures.length < 3 && Math.random() < 0.02 * dreadLevel) spawnFigure();
      for (let i = figures.length - 1; i >= 0; i--) {
        const f = figures[i];
        f.life++;
        const t = f.life / f.max;
        const alpha = Math.sin(t * Math.PI) * 0.5 * dreadLevel;
        dctx.fillStyle = `rgba(0,0,0,${alpha})`;
        dctx.beginPath();
        dctx.ellipse(f.x, f.y - f.h*0.42, f.w*0.32, f.w*0.32, 0, 0, Math.PI*2); // head
        dctx.fill();
        dctx.fillRect(f.x - f.w/2, f.y - f.h*0.3, f.w, f.h*0.8);                 // body
        if (f.life >= f.max) figures.splice(i, 1);
      }
    }
    requestAnimationFrame(dreadLoop);

    // ---------- WHISPERS (low-sanity voice oscillator) ----------
    function whisper() {
      if (!audioReady() || gameOver) return;
      if (Math.random() > dreadLevel * 0.6) return;   // only as you slip
      const ctx = AUDIO.ctx, t = ctx.currentTime;
      const dur = 0.6 + Math.random()*0.7;
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      const base = 90 + Math.random()*60;
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.linearRampToValueAtTime(base * (0.8 + Math.random()*0.5), t + dur);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 700 + Math.random()*500; bp.Q.value = 6;
      const lfo = ctx.createOscillator();          // formant wobble = "voice"
      lfo.frequency.value = 5 + Math.random()*6;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 300;
      lfo.connect(lfoGain).connect(bp.frequency);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05 * dreadLevel, t + dur*0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(bp).connect(g).connect(AUDIO.master);
      osc.start(t); lfo.start(t);
      osc.stop(t + dur); lfo.stop(t + dur);
    }
    setInterval(whisper, 9000);

    // ---------- PARANOIA DECISION EVENTS ----------
    // Occasional forced choices. Each option is a sanity gamble.
    const DECISIONS = [
      { q:'A black SUV idles across the street. Engine running. No one gets out.',
        a:[ { t:'Close the blinds. Keep reading.', d:-4, m:'You pretend you didn\'t see it. It saw you.' },
            { t:'Step out and photograph the plate.', d:+6, m:'It pulls away. You have the plate. Small victory.' } ] },
      { q:'The Handler is requesting an out-of-band voice channel. Unscheduled.',
        a:[ { t:'Answer it.', d:-9, m:'A voice that is almost yours reads your own address back to you.' },
            { t:'Pull the battery.', d:+5, m:'Dead air. The static drops. You can breathe.' } ] },
      { q:'You find a node in your own handwriting that you do not remember adding.',
        a:[ { t:'Open it.', d:-10, m:'It\'s a memory you were supposed to have lost. Now it\'s leaking.' },
            { t:'Leave it sealed.', d:-2, m:'You walk past it. It\'s still there. It\'s always there.' } ] },
      { q:'A toast appeared one second before you triggered it. The cursor moved first.',
        a:[ { t:'Keep working. Coincidence.', d:-6, m:'You don\'t believe yourself.' },
            { t:'Reboot the channel.', d:+3, m:'The lag clears. For now.' } ] },
      { q:'Someone screenshotted this session. You felt the shutter.',
        a:[ { t:'Transmit the field report first.', d:+4, m:'If it leaks, let it leak on your terms.' },
            { t:'Wipe everything.', d:-5, m:'Your hand hovers over REBOOT. You don\'t. You never do.' } ] },
      { q:'An envelope under the door. Inside: a printout of your own INTEL ledger, annotated in red.',
        a:[ { t:'Burn it without reading the notes.', d:-3, m:'The smoke smells like toner and certainty. You\'ll wonder forever.' },
            { t:'Read every annotation.', d:-8, m:'The handwriting is yours. The dates are next week.' } ] },
      { q:'The FOIA portal shows a request in your name you never filed. Status: GRANTED.',
        a:[ { t:'Download the release.', d:+7, m:'Three hundred pages. Real ones. Someone upstairs is helping you.' },
            { t:'Withdraw the request.', d:-6, m:'The withdrawal bounces. "Requester unknown." Then who filed it?' } ] },
      { q:'Your own voice on the shortwave band, reading numbers. It pauses, waiting.',
        a:[ { t:'Write the numbers down.', d:-7, m:'They form a ROT cipher. You already know what it decodes to.' },
            { t:'Kill the radio.', d:+4, m:'Silence. The good kind, for once. You bank the nerve instead.' } ] },
    ];
    function modalOpen() { return document.getElementById('modalBg').classList.contains('show'); }
    function maybeDecision() {
      if (gameOver || modalOpen()) return;
      // more likely as sanity falls; never certain
      const chance = 0.12 + (1 - sanity/100) * 0.28;
      if (Math.random() > chance) return;
      const d = DECISIONS[Math.floor(Math.random()*DECISIONS.length)];
      triggerStaticBurst(0.9);
      const modal = document.getElementById('modal');
      modal.innerHTML = `
        <div class="decision">
          <h2 style="color:#ffaa00">⚠ PARANOIA EVENT</h2>
          <div class="doc-line warn">${d.q}</div>
          <div class="choice-row">
            ${d.a.map((opt,i)=>`<button class="btn" onclick="resolveDecision(${DECISIONS.indexOf(d)},${i})">${opt.t}</button>`).join('')}
          </div>
        </div>`;
      showModal();
    }
    function resolveDecision(di, ai) {
      const opt = DECISIONS[di].a[ai];
      setSanity(sanity + opt.d);
      const sign = opt.d >= 0 ? '+' : '';
      toast(`${opt.m}  [${sign}${opt.d} SANITY]`);
      opt.d < 0 ? triggerStaticBurst(1.2) : handlerBeep();
      closeModal();
    }

    // ---------- SLOW PASSIVE DRAIN ----------
    setInterval(() => { if (sanity > 0 && !gameOver) setSanity(sanity - 1); }, 12000);
    // periodic chance of a forced decision
    setInterval(maybeDecision, 21000);
    // periodic chance of an encrypted intercept (cipher minigame)
    setInterval(maybeIntercept, 34000);

    // ---------- BOOT ----------
    loadMeta();
    load();
    // replay tension: from run 2 onward, one undiscovered dossier is corrupted —
    // double drain, double intel, magenta flicker. Picked once per run, persisted.
    if (meta.runs >= 1 && !corruptedId && !gameOver) {
      const candidates = DOC_NODES.filter(id => {
        const n = NODES.find(x => x.id === id);
        return !discovered.has(id) && (n.type === 'doc' || n.type === 'op');
      });
      if (candidates.length) corruptedId = candidates[Math.floor(Math.random() * candidates.length)];
    }
    document.getElementById('filesTotal').textContent = DOC_NODES.length;
    document.getElementById('intelNum').textContent = intel;
    buildNodes();
    if (corruptedId && !discovered.has(corruptedId) && nodeEls[corruptedId]) {
      nodeEls[corruptedId].classList.add('corrupted');
    }
    renderEdges();
    setSanity(sanity);
    updateProgress();
    renderDirectives();
    if (gameOver && endingKey) showEnding(endingKey);
    if (view.x === 0 && view.y === 0 && view.scale === 1) resetView(); else applyView();

    // ---------- AUDIO BOOT ----------
    reflectAudioBtn();
    // If audio was live last session, resume on first canvas gesture (autoplay
    // policies need a user interaction; the header button is outside #viewport
    // so toggling stays explicit).
    if (localStorage.getItem(AUDIO_KEY) === 'live') {
      const resumeOnce = () => { if (!AUDIO.on) enableAudio(); };
      viewport.addEventListener('pointerdown', resumeOnce, { once: true });
    }

    // boot toasts
    setTimeout(() => toast(`CLEARANCE Lv.${clearance} ${CLEARANCE_NAMES[clearance]}. Recover documents to ascend.`), 400);
    setTimeout(() => toast("HANDLER DIRECTIVES uplinked. Check the panel, left."), 1600);
    setTimeout(() => toast("⊕ FUSE two signals to find hidden patterns — but forcing a bad link costs you."), 3000);
    setTimeout(() => toast("Open LINKED dossiers back-to-back for SIGNAL CHAIN intel bonuses."), 4600);
    if (meta.runs >= 1) setTimeout(() => toast(`RUN #${meta.runs + 1}. One dossier came back CORRUPTED. Find the magenta flicker.`), 6200);
    </script>
</body>
</html>
