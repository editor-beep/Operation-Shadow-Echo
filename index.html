<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPERATION: SHADOW ECHO v3.2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body {
            margin: 0; padding: 0;
            background: #020202;
            color: #00aa00;
            font-family: 'VT323', monospace;
            height: 100vh;
            overflow: hidden;
        }
        
        .scanlines {
            position: fixed; inset: 0;
            background: repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0,60,0,0.3) 2px, rgba(0,60,0,0.3) 4px);
            pointer-events: none; z-index: 9999;
            animation: flicker 0.07s infinite alternate;
        }

        .container { display: flex; height: 100vh; flex-direction: column; }
        
        .header-area {
            background: #050505;
            border-bottom: 3px solid #880000;
            padding: 6px 10px;
            flex-shrink: 0;
        }
        
        h1 { 
            margin: 0; 
            font-size: 2em; 
            text-align: center;
            color: #cc0000; 
            text-shadow: 0 0 20px #880000;
            animation: glitch 1.4s infinite;
        }
        
        .terminal {
            flex: 1;
            background: #000;
            border: 3px solid #660000;
            margin: 6px;
            padding: 18px;
            overflow-y: auto;
            box-shadow: 0 0 30px #220000 inset;
            font-size: 2.05rem;           /* Bigger text */
            line-height: 1.4;
            min-height: 0;
        }
        
        .log p { margin: 10px 0; }
        
        .input-area {
            padding: 8px 10px;
            background: #050505;
            border-top: 3px solid #880000;
            flex-shrink: 0;
            max-height: 45vh;             /* Limit button area */
            overflow-y: auto;
        }
        
        button {
            background: #0a0a0a; 
            color: #00bb00; 
            border: 2px solid #660000;
            padding: 13px 16px; 
            margin: 4px 0; 
            font-size: 1.18rem;
            width: 100%; 
            text-align: left; 
            cursor: pointer;
        }
        
        button:hover { background: #330000; color: #ff4444; }

        .status-bar {
            position: fixed; top: 6px; right: 6px; z-index: 10000;
            background: rgba(40,0,0,0.95); padding: 4px 10px;
            border: 1px solid #aa0000; color: #ff7777; font-size: 0.85rem;
        }

        @keyframes glitch { 0%,100% { transform: translate(0); } 20% { transform: translate(-3px,2px); } 40% { transform: translate(3px,-2px); } }
        
        @media (max-width: 768px) {
            .terminal { font-size: 1.85rem; padding: 14px; }
            button { font-size: 1.15rem; padding: 12px 14px; }
            h1 { font-size: 1.85em; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="status-bar" id="status">SANITY: <span id="sanity">83</span>% • TARGET #7743921</div>
    
    <div class="container">
        <div class="header-area">
            <h1>SHADOW ECHO v3.2</h1>
            <p style="text-align:center; color:#990000; margin:4px 0 0 0; font-size:1.1rem;">ALL OF IT IS REAL.</p>
        </div>
        
        <div class="terminal" id="terminal">
            <div class="log" id="log"></div>
        </div>
        
        <div class="input-area" id="choices"></div>
    </div>

    <script>
        let sanity = 83;
        const log = document.getElementById('log');
        const choicesDiv = document.getElementById('choices');

        function addLog(text, color = '#00aa00') {
            const p = document.createElement('p');
            p.innerHTML = text;
            p.style.color = color;
            log.appendChild(p);
            log.scrollTop = log.scrollHeight;
        }

        function updateStatus() {
            sanity = Math.max(0, sanity - 1);
            document.getElementById('sanity').textContent = sanity;
        }

        function refreshChoices() {
            choicesDiv.innerHTML = `
                <button onclick="makeChoice(1)">MKULTRA + ST. LOUIS POISONING</button>
                <button onclick="makeChoice(2)">PROJECT MONARCH FILES</button>
                <button onclick="makeChoice(3)">PROJECT BLUE BEAM</button>
                <button onclick="makeChoice(4)">ST. LOUIS ARCHIVES</button>
                <button onclick="makeChoice(6)">CHEMTRAILS & SMART DUST</button>
                <button onclick="makeChoice(5)">CHAT WITH HANDLER</button>
                <button onclick="makeChoice(9)">PLAN CIA DIRECTOR ASSASSINATION</button>
                <button onclick="makeChoice(8)" style="color:#ff4444">FINAL TRANSMISSION</button>
            `;
        }

        function makeChoice(id) {
            updateStatus();
            addLog("Signal received...", "#00dd00");
            // Add your full logic here later
            refreshChoices();
        }

        window.onload = () => {
            addLog("<span style='color:#ff0000'>[LEVEL 7 CLEARANCE GRANTED]</span>", "#ff0000");
            addLog("They told you these were just theories.", "#00cc00");
            addLog("Welcome to the real world.");
            refreshChoices();
        };

        setInterval(updateStatus, 3500);
    </script>
</body>
</html>
