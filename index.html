<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERATION: SHADOW ECHO v2.1 • EYES ONLY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #0f0;
            font-family: 'VT323', monospace;
            overflow: hidden;
        }
        
        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(transparent 0px, transparent 2px, rgba(0,255,0,0.1) 2px, rgba(0,255,0,0.1) 4px);
            pointer-events: none;
            z-index: 9999;
            animation: flicker 0.12s infinite alternate;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 240px;
            background: #111;
            border-right: 3px solid #0f0;
            padding: 15px;
            overflow-y: auto;
        }
        
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            border-bottom: 3px solid #0f0;
            padding: 12px;
            background: #111;
        }
        
        h1 {
            margin: 0;
            font-size: 2.8em;
            letter-spacing: 6px;
            animation: glitch 1.8s infinite;
            text-shadow: 0 0 15px #0f0;
        }
        
        .terminal {
            flex: 1;
            background: #0a0a0a;
            border: 3px solid #0f0;
            margin: 15px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 0 40px #0f0 inset;
        }
        
        .log p {
            margin: 6px 0;
            line-height: 1.35;
        }
        
        .redacted {
            color: #f00;
            text-decoration: line-through wavy;
            animation: redacted-flicker 400ms infinite;
        }
        
        .input-area {
            padding: 15px;
            background: #111;
            border-top: 3px solid #0f0;
        }
        
        button {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 12px 16px;
            margin: 5px 0;
            font-family: 'VT323', monospace;
            font-size: 1.15em;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        
        button:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 15px #0f0;
        }
        
        .status-bar {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(20,0,0,0.95);
            padding: 6px 16px;
            border: 1px solid #f00;
            font-size: 0.95em;
            z-index: 10000;
        }
        
        @keyframes glitch {
            0%,100% { transform: translate(0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); }
        }
        
        @keyframes redacted-flicker {
            0%,100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="status-bar" id="status">MKULTRA ACTIVE • SANITY: <span id="sanity">92</span>% • TARGET #7743921</div>
    
    <div class="container">
        <div class="sidebar">
            <h3 style="margin-top:0; color:#f80;">COLLECTED EVIDENCE</h3>
            <div id="evidence-list"></div>
            
            <h3 style="margin-top:30px; color:#f0f;">HANDLER STATUS</h3>
            <div id="handler" style="color:#f66;">CONNECTED • MONITORING</div>
        </div>
        
        <div class="main">
            <header>
                <h1>SHADOW ECHO v2.1</h1>
                <p>THEY NEVER STOPPED. THEY ONLY WENT DEEPER.</p>
            </header>
            
            <div class="terminal" id="terminal">
                <div class="log" id="log"></div>
            </div>
            
            <div class="input-area" id="choices"></div>
        </div>
    </div>

    <script>
        let sanity = 92;
        let evidence = [];
        let handlerResponses = 0;
        
        const log = document.getElementById('log');
        const choicesDiv = document.getElementById('choices');
        
        function addLog(text, color = '#0f0') {
            const p = document.createElement('p');
            p.innerHTML = text;
            p.style.color = color;
            log.appendChild(p);
            log.scrollTop = log.scrollHeight;
            
            if (Math.random() > 0.75) {
                setTimeout(() => p.classList.add('redacted'), Math.random() * 1500);
            }
        }
        
        function updateStatus() {
            sanity = Math.max(8, sanity - 1);
            document.getElementById('sanity').textContent = sanity;
            if (sanity < 45) document.getElementById('status').style.color = '#f00';
        }
        
        function addEvidence(item) {
            if (!evidence.includes(item)) {
                evidence.push(item);
                document.getElementById('evidence-list').innerHTML = evidence.map(e => `• ${e}`).join('<br>');
            }
        }
        
        function makeChoice(id) {
            updateStatus();
            
            switch(id) {
                case 1:
                    addLog("<span style='color:#ff0'>[MKULTRA ARCHIVE]</span>", "#ff0");
                    addLog("LSD, hypnosis, sexual trauma on civilians and children. The program never ended.");
                    addEvidence("MKULTRA");
                    break;
                case 2:
                    addLog("<span style='color:#f0f'>[PROJECT MONARCH]</span>", "#f0f");
                    addLog("Trauma-based mind control. Butterfly triggers in media. Many elites show signs.");
                    addEvidence("MONARCH");
                    sanity -= 12;
                    break;
                case 3:
                    addLog("<span style='color:#0ff'>[PROJECT BLUE BEAM]</span>", "#0ff");
                    addLog("Holographic false flags. Fake alien invasion or second coming using sky projections.");
                    addEvidence("BLUE BEAM");
                    break;
                case 4:
                    addLog("<span style='color:#fa0'>[ST. LOUIS 1953-54]</span>", "#fa0");
                    addLog("CIA & Army sprayed radioactive zinc cadmium sulfide over the city for days.");
                    addEvidence("ST. LOUIS SPRAY");
                    break;
                case 5:
                    handlerChat();
                    return;
                case 6:
                    addLog("Chemtrails contain aluminum, barium, and nanotech for weather + mind control.");
                    addEvidence("CHEMTRAILS");
                    break;
                case 7:
                    endGame();
                    return;
            }
            
            if (Math.random() > 0.6) {
                const events = ["Phone vibrated with no notification.", "Birds just went completely silent.", "Black SUV passed slowly."];
                addLog(events[Math.floor(Math.random()*events.length)], "#f80");
            }
            
            refreshChoices();
        }
        
        function handlerChat() {
            handlerResponses++;
            const msgs = [
                "Handler: You're asking dangerous questions...",
                "Handler: The programmers smile at you from your TV every night.",
                "Handler: Blue Beam Phase 1 is already testing in select cities.",
                "Handler: Have you noticed your trigger phrase yet?"
            ];
            addLog(msgs[handlerResponses % msgs.length], "#f66");
            
            if (handlerResponses > 5) {
                addLog("<span style='color:#f00'>TRACE DETECTED. THEY KNOW YOU'RE HERE.</span>", "#f00");
                sanity -= 25;
            }
        }
        
        function refreshChoices() {
            choicesDiv.innerHTML = `
                <button onclick="makeChoice(1)">MKULTRA DEEP DIVE</button>
                <button onclick="makeChoice(2)">PROJECT MONARCH</button>
                <button onclick="makeChoice(3)">PROJECT BLUE BEAM</button>
                <button onclick="makeChoice(4)">ST. LOUIS SPRAY FILES</button>
                <button onclick="makeChoice(6)">CHEMTRAILS & SMART DUST</button>
                <button onclick="makeChoice(5)" style="color:#ff88ff">CHAT WITH YOUR HANDLER</button>
                <button onclick="makeChoice(7)" style="color:#f33;margin-top:15px">FINAL TRANSMISSION</button>
            `;
        }
        
        function endGame() {
            addLog("<span style='color:#f00;font-size:1.6em'>FINAL TRANSMISSION INITIATED</span>", "#f00");
            setTimeout(() => {
                document.body.innerHTML = `
                <div style="position:fixed;inset:0;background:#000;color:#f00;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;font-family:VT323">
                    <h1 style="font-size:3.5em;animation:glitch 200ms infinite;">YOU WERE ALWAYS THE EXPERIMENT</h1>
                    <p style="font-size:1.8em;margin:40px 0;">THE HANDLERS THANK YOU FOR YOUR SERVICE, ASSET.</p>
                    <button onclick="location.reload()" style="padding:25px 60px;font-size:1.8em;background:#300;color:#f66;border:3px solid #f00;">REBOOT REALITY</button>
                </div>`;
            }, 1500);
        }
        
        function boot() {
            addLog("<span style='color:#f00'>[CLASSIFIED — DO NOT SHARE]</span>", "#f00");
            addLog("Welcome back, sleeper.", "#0ff");
            addLog("Everything they told you was a lie.");
            refreshChoices();
        }
        
        setInterval(updateStatus, 4200);
        
        document.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'r') {
                sanity = Math.min(100, sanity + 15);
                addLog("RED PILL BOOST ACTIVATED", "#0f0");
            }
        });
        
        window.onload = boot;
    </script>
</body>
</html>
